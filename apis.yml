apis:
- name: Cakewalk Open API
  description: >-
    The Cakewalk Open API is a REST API for building custom access-governance
    workflows and integrations. It exposes users, user groups, work apps,
    accesses, permission levels, requests, tasks, policies, and access reviews.
    Authentication uses X-API-KEY and X-API-SECRET headers; responses use
    cursor-based JSON:API-style pagination and RFC 7807 ProblemDetails errors,
    with a 1,000 requests-per-minute rate limit. A hosted MCP server and signed
    webhooks complete the developer surface.
