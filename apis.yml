aid: cakewalk
name: Cakewalk
description: >-
  Cakewalk is the agentic access management platform for fast-moving companies,
  combining a granular identity governance and administration (IGA) platform
  with AI-driven workflows. Cakewalk governs access for both human identities
  and AI agents: its MCP Gateway routes every AI agent tool call through a
  runtime policy engine with credential mediation, least-privilege enforcement,
  and a complete audit trail, while its human access management handles
  joiner-mover-leaver lifecycle, access requests, access reviews, and
  auto-provisioning via its Agent Cake provisioning agent. The Cakewalk Open API
  and hosted MCP server let developers manage users, groups, work apps,
  accesses, requests, and tasks programmatically. Founded in 2022 and backed by
  Seedcamp, Fly Ventures, and Possible Ventures.
